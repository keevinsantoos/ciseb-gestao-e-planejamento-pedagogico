<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- IMPRESSORA 3D OFICIAL CISEB -->
  <g fill="none" stroke="#005BAC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base Principal -->
    <rect x="24" y="152" width="152" height="24" rx="4" />
    <rect x="48" y="160" width="40" height="8" rx="2" />
    <circle cx="112" cy="164" r="6" />
    <!-- Pes de Apoio -->
    <path d="M 28 176 L 36 176" stroke-width="5" />
    <path d="M 164 176 L 172 176" stroke-width="5" />

    <!-- Quadro / Gantry Superior -->
    <path d="M 36 152 L 36 44 C 36 40 40 36 44 36 L 156 36 C 160 36 164 40 164 44 L 164 152" />
    <path d="M 44 48 L 156 48" />

    <!-- Colunas Verticais Internas -->
    <line x1="48" y1="48" x2="48" y2="152" stroke-width="4" />
    <line x1="152" y1="48" x2="152" y2="152" stroke-width="4" />

    <!-- Carretel de Filamento a Direita -->
    <ellipse cx="146" cy="100" rx="10" ry="24" stroke-width="4" />

    <!-- Tubo / Guia de Filamento Superior -->
    <path d="M 100 16 C 100 16 100 36 100 68" stroke-width="5" />
    <path d="M 100 16 C 120 16 150 16 150 70" stroke-width="4" />

    <!-- Cabecote Extrusor -->
    <rect x="90" y="68" width="20" height="22" rx="2" />
    <circle cx="100" cy="78" r="4" />
    <!-- Bico Extrusor -->
    <path d="M 98 90 L 102 90 L 100 95 Z" fill="#005BAC" />

    <!-- Mesa de Impressao -->
    <rect x="62" y="132" width="76" height="8" rx="2" />
    <line x1="68" y1="140" x2="68" y2="148" />
    <line x1="132" y1="140" x2="132" y2="148" />

    <!-- Objeto 3D Impresso no Centro: "3D" -->
    <!-- Numero 3 -->
    <path d="M 76 106 L 90 106 L 90 116 L 82 116 L 90 116 L 90 130 L 76 130" stroke-width="6" />
    <!-- Letra D -->
    <path d="M 102 106 L 112 106 C 122 106 126 112 126 118 C 126 124 122 130 112 130 L 102 130 Z" stroke-width="6" />
    <line x1="102" y1="106" x2="102" y2="130" stroke-width="6" />

    <!-- Filamento Descendo do Bico para a peca -->
    <path d="M 100 95 C 100 102 96 104 98 106" stroke-width="4" />
  </g>
</svg>
